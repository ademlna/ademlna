<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="planetGrad" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#FFE1A8"/>
      <stop offset="45%" stop-color="#E8A33D"/>
      <stop offset="100%" stop-color="#5EC8D8"/>
      <animate attributeName="cx" values="35%;42%;35%" dur="6s" repeatCount="indefinite"/>
    </radialGradient>

    <filter id="hueShift" x="-50%" y="-50%" width="200%" height="200%">
      <feColorMatrix type="hueRotate" values="0">
        <animate attributeName="values" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      </feColorMatrix>
    </filter>

    <path id="orbitPath1" d="M 450,168 m -155,0 a 155,155 0 1,1 310,0 a 155,155 0 1,1 -310,0" fill="none"/>
    <path id="orbitPath2" d="M 450,168 m -225,0 a 225,225 0 1,1 450,0 a 225,225 0 1,1 -450,0" fill="none"/>
  </defs>

  <rect width="900" height="320" fill="#0B0E14"/>

  <g fill="#E8E6DF">
    <circle cx="55" cy="35" r="1.5"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="80" r="1.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="50" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="120" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="220" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="270" r="1.1"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="250" r="1.5"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="290" r="1.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="20" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="300" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <use href="#orbitPath1" stroke="#1F2530" stroke-width="1"/>
  <use href="#orbitPath2" stroke="#1F2530" stroke-width="1"/>

  <g filter="url(#hueShift)">
    <circle cx="450" cy="168" r="68" fill="url(#planetGrad)"/>
    <ellipse cx="450" cy="168" rx="112" ry="17" fill="none" stroke="#E8A33D" stroke-width="3" opacity="0.55" transform="rotate(-12 450 168)"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 450 168" to="360 450 168" dur="16s" repeatCount="indefinite"/>
    <text font-family="'JetBrains Mono', monospace" font-size="15" letter-spacing="4" fill="#5EC8D8">
      <textPath href="#orbitPath1" startOffset="0%">ADE MAULANA HIDAYAH  •  FULLSTACK WEB DEVELOPER  •  </textPath>
      <animate attributeName="fill" values="#5EC8D8;#E8A33D;#B98EFF;#59D18C;#5EC8D8" dur="10s" repeatCount="indefinite"/>
    </text>
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 450 168" to="0 450 168" dur="24s" repeatCount="indefinite"/>
    <text font-family="'JetBrains Mono', monospace" font-size="12.5" letter-spacing="3" fill="#E8A33D">
      <textPath href="#orbitPath2" startOffset="0%">REACT  •  NEXT.JS  •  NODE.JS  •  TYPESCRIPT  •  REDIS  •  MYSQL  •  DOCKER  •  AI API  •  </textPath>
      <animate attributeName="fill" values="#E8A33D;#B98EFF;#59D18C;#5EC8D8;#E8A33D" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
